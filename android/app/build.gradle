plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
    id "com.google.gms.google-services"
}
def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}



def flutterVersionCode = localProperties.getProperty('flutter.versionCode')
if (flutterVersionCode == null) {
    flutterVersionCode = '1'
}

def flutterVersionName = localProperties.getProperty('flutter.versionName')
if (flutterVersionName == null) {
    flutterVersionName = '1.0'
}


def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('key.properties')
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {

    namespace "com.example.sketch"
    compileSdkVersion flutter.compileSdkVersion
    ndkVersion flutter.ndkVersion

    kotlinOptions {
        jvmTarget = '1.8'
    }
    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }
    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
    }

    defaultConfig {
        applicationId = "com.example.sketch"
        minSdk = localProperties.getProperty("flutter.minSdkVersion", "23").toInteger()
        targetSdk = localProperties.getProperty("flutter.targetSdkVersion", "33").toInteger()
        versionCode = flutterVersionCode
        versionName = flutterVersionName
    }


    buildTypes {
        release {
            signingConfig = signingConfigs.debug
            // signingConfig = signingConfigs.release
        }
    }

}

flutter {
    source = "../.."
}

// Flutter Gradle Plugin must be applied last
// apply plugin: "dev.flutter.flutter-gradle-plugin"

// dependencies {
//     implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk8:$kotlin_version"
// }

// apply from: "$flutterRoot/packages/flutter_tools/gradle/flutter.gradle"

dependencies {
    // implementation platform('com.google.firebase:firebase-bom:31.1.1')
    // implementation(platform("com.google.firebase:firebase-bom:33.7.0"))
    implementation(platform("com.google.firebase:firebase-bom:33.7.0"))
    implementation 'com.google.firebase:firebase-analytics'
    implementation 'com.google.android.gms:play-services-auth:20.7.0' // Add this line

}
